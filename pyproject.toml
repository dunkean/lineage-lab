[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-lab"
version = "0.1.0"
description = "A standalone sandbox for population histories and genealogies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "numba>=0.67,<0.68", "pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "build>=1"]

[project.scripts]
lineage-lab = "lineage_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lineage_lab = ["explorer.html", "studio.css", "studio.js", "vendor/*", "presets/*.yaml", "chronos_contract/*.json", "chronos_contract/*.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
