[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cousinade"
version = "0.1.0"
description = "Tiny worldbuilding sandbox. Suspiciously large family reunion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "numba>=0.67,<0.68", "pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "build>=1"]

[project.scripts]
cousinade = "cousinade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cousinade = ["explorer.html", "studio.css", "studio.js", "vendor/*", "presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
